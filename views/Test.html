<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Our Website</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>

  <div class="donation-container">
    <h2>Support Our Website</h2>
    <p>Your donations help us keep improving and providing better services. Every contribution matters!</p>

    <div class="donation-options">
      <button class="donation-btn" data-amount="5">$5</button>
      <button class="donation-btn" data-amount="10">$10</button>
      <button class="donation-btn" data-amount="20">$20</button>
      <button class="donation-btn custom">Custom Amount</button>
    </div>

    <input type="number" id="custom-amount" placeholder="Enter amount" style="display: none;">

    <button id="donate-now">Donate Now</button>

    <p class="thanks-message" id="thanks-message" style="display: none;">Thank you for your support! ❤️</p>
  </div>

  <script src="/script.js"></script>

</body>

</html>
